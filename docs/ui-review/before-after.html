<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首页优化前后对比</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#252a26;font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1440px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:0 0 8px}p{margin:0}.note{margin:20px 0;background:#eae6dd;padding:16px;border-left:3px solid #a47650}.changes{display:flex;flex-wrap:wrap;gap:10px 30px;padding:0;list-style:none;color:#365849}.buttons{display:flex;gap:8px;margin:22px 0 14px}button{border:1px solid #adb4aa;background:transparent;padding:9px 18px;font:inherit;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#29392e;color:#fff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.column{min-width:0}.label{display:flex;justify-content:space-between;align-items:baseline}.label h2{font-size:18px;margin:0 0 8px}.label a{color:#466858;font-size:13px}.frame{background:#ddd9cf;padding:10px;max-height:900px;overflow:auto}.frame img{display:block;width:100%;height:auto}.mobile .frame img{max-width:390px;margin:auto}.foot{font-size:13px;color:#68716a;margin-top:16px}@media(max-width:650px){main{padding:24px 14px}.pair{gap:8px}.frame{padding:4px;max-height:72vh}.label{display:block}}</style><main><h1>首页：优化前后对比</h1><p>左右是同一设备视口的真实完整截图。分别在截图区域滚动，即可对照各区块；点击“查看原图”可以放大。</p><div class="note"><strong>说明：</strong>两次截图之间还出现了其他已有页面变化，例如首页小标识和区块标题。这里展示的是两个时间点的整体差异，并非所有差异都来自这次精修。</div><strong>这轮明确调整</strong><ul class="changes"><li>① 收紧首页上下间距</li><li>② 放大分类说明和部分阅读链接</li><li>③ 缩短手机介绍区间距</li></ul><div class="buttons" role="group" aria-label="选择设备"><button data-mode="mobile" aria-pressed="true">手机 · 390px</button><button data-mode="desktop" aria-pressed="false">桌面 · 1280px</button></div><div class="pair mobile" id="pair"><section class="column"><div class="label"><h2>修改前</h2><a id="before-link" target="_blank">查看原图 ↗</a></div><div class="frame"><img id="before" alt="修改前首页"></div></section><section class="column"><div class="label"><h2>修改后</h2><a id="after-link" target="_blank">查看原图 ↗</a></div><div class="frame"><img id="after" alt="修改后首页"></div></section></div><p class="foot">原始截图：修改前 docs/ui-review/before；修改后 .oil-ui/home-refinement/after。截图均为深色主题。</p></main><script>function setMode(mode){let suffix=mode==='mobile'?'390x844':'1280x900';document.querySelector('#pair').className='pair '+mode;for(let kind of ['before','after']){let base=kind==='before'?'before/':'../../.oil-ui/home-refinement/after/';let url=base+'page-'+suffix+'.png';document.querySelector('#'+kind).src=url;document.querySelector('#'+kind+'-link').href=url}document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));setMode('mobile')</script></html>
